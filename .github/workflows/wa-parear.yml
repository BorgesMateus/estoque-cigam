name: wa-parear

on:
  workflow_dispatch: {}

jobs:
  parear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm i --no-save @whiskeysockets/baileys qrcode-terminal pino
      - name: Parear (escaneie o QR que aparece neste log)
        run: node scripts/wa.mjs parear
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
